<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>لکنت زبان | دانشنامه آفلاین نسخه‌ها</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="container">
  <div class="breadcrumbs">
    <a href="../index.html">نسخه‌ها</a>
    <span>›</span>
    <a href="../categories/روانپزشکی.html">روانپزشکی</a>
    <span>›</span>
    <span>لکنت زبان</span>
  </div>

  <div class="page-header">
    <div class="header-info">
      <img class="header-icon" src="../images/img_b6fb008f01a9.jpg" alt="لکنت زبان">
      <div>
        <h1 class="header-title">لکنت زبان</h1>
      </div>
    </div>
    <a href="../categories/روانپزشکی.html" class="btn-back">← بازگشت به روانپزشکی</a>
  </div>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('treatment')">درمان</button>
    <button class="tab-btn" onclick="switchTab('signs')">علائم</button>
    <button class="tab-btn" onclick="switchTab('ddx')">DDX</button>
    <button class="tab-btn" onclick="switchTab('gallery')">تصاویر (0)</button>
  </div>

  <div id="tab-treatment" class="tab-content active"><p alignment="right"><span lang="FA" style='font-family:"Arial",sans-serif;mso-ascii-font-family:Calibri;mso-ascii-theme-font:
minor-latin;mso-hansi-font-family:Calibri;mso-hansi-theme-font:minor-latin;
mso-bidi-theme-font:minor-bidi;mso-bidi-language:FA'>گفتار درمانی</span></p><p alignment="left"><span style="mso-bidi-language:FA">Tab Haloperidol 0.5mg<span style="mso-spacerun:yes">  </span>N=30 q12h </span></p></div>
  <div id="tab-signs" class="tab-content"></div>
  <div id="tab-ddx" class="tab-content"><p alignment="right">1️⃣ اوتیسم<br/>2️⃣ آفازی<br/>3️⃣ دیزارتری<br/>4️⃣ Selective mutism</p></div>
  <div id="tab-gallery" class="tab-content"><div class="gallery-grid"><p style="color: var(--muted); padding: 1rem;">تصویری برای این نسخه موجود نیست.</p></div></div>
</div>

<script>
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  
  const content = document.getElementById('tab-' + name);
  if (content) content.classList.add('active');
  
  event.target.classList.add('active');
  history.replaceState(null, null, '#tab=' + name);
}

window.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash || window.location.search;
  if (hash.includes('signs')) document.querySelectorAll('.tab-btn')[1].click();
  else if (hash.includes('ddx')) document.querySelectorAll('.tab-btn')[2].click();
  else if (hash.includes('gallery')) document.querySelectorAll('.tab-btn')[3].click();
});
</script>
</body>
</html>
