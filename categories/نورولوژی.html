<!DOCTYPE html>
<html lang="fa" dir="rtl">

  <div class="page-header">
    <div class="header-info">
      <img class="header-icon" src="../images/img_2b044b8b2afc.svg" alt="نورولوژی">
      <div>
        <h1 class="header-title">نورولوژی</h1>
      </div>
    </div>
    <a href="../index.html" class="btn-back">← بازگشت به دسته‌ها</a>
  </div>

  <input type="text" id="filter" class="search-input" placeholder="جستجو در نسخه‌های نورولوژی..." oninput="filterCards()">

  <div class="grid" id="cardGrid">
    
            <a href="../prescriptions/17.html" class="item-card">
              <img src="../images/img_8287f97358af.png" alt="تشنج">
              <h3>تشنج</h3>

            <a href="../prescriptions/157.html" class="item-card">

            <a href="../prescriptions/158.html" class="item-card">

            </a>
            
  </div>
</div>

<script>
function filterCards() {
  const q = document.getElementById('filter').value.toLowerCase().trim();
  document.querySelectorAll('.item-card').forEach(card => {
    const text = card.innerText.toLowerCase();
    card.style.display = text.includes(q) ? 'flex' : 'none';
  });
}
</script>
</body>
