function doSearch() {
  const q = document.getElementById('globalSearch').value.toLowerCase().trim();
  const resDiv = document.getElementById('searchResults');
  const catGrid = document.getElementById('categoryGrid');

  if (!q) {
    resDiv.style.display = 'none';
    catGrid.style.display = 'grid';
    return;
  }

  const filtered = DB.filter(p => p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q));
  catGrid.style.display = 'none';
  resDiv.style.display = 'grid';

  if (filtered.length === 0) {
    resDiv.innerHTML = '<div style="color: var(--muted); grid-column: 1/-1; text-align: center; padding: 1.5rem;">موردی یافت نشد.</div>';
    return;
  }

  resDiv.innerHTML = filtered.map(p => `
    <a href="prescriptions/${p.id}.html" class="item-card">
      <img src="${p.icon.replace('../', '')}" alt="${p.title}">
      <h3>${p.title}</h3>
    </a>
  `).join('');
}
</script>
